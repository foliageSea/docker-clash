name: Release Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to release (for example, v1.2.0)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: foliage-sea/docker-clash

jobs:
  build:
    name: Build linux/${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a semantic version tag beginning with v (for example, v1.2.0)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.value }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
           outputs: type=docker,dest=${{ runner.temp }}/docker-clash-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Compress image archive
        shell: bash
           run: gzip -9 "${{ runner.temp }}/docker-clash-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
           name: docker-clash-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
           path: ${{ runner.temp }}/docker-clash-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "value=${INPUT_VERSION:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Download image artifacts
        uses: actions/download-artifact@v5
        with:
           pattern: docker-clash-${{ steps.version.outputs.value }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum ./*.tar.gz > "SHA256SUMS-${{ steps.version.outputs.value }}.txt"

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag
          fi
