services:
  docker-clash:
    build:
      context: .
      args:
        MIHOMO_VERSION: v1.19.28
    image: foliage-sea/docker-clash:local
    restart: unless-stopped
    ports:
      - "9080:9080"
      - "${DOCKER_CLASH_MIXED_HOST_PORT:-27890}:7890/tcp"
      - "${DOCKER_CLASH_MIXED_HOST_PORT:-27890}:7890/udp"
    volumes:
      - docker-clash-data:/data

volumes:
  docker-clash-data:
